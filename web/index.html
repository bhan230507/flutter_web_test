<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="saju_flutter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>saju_flutter</title>
  <link rel="manifest" href="manifest.json">
  
  <script>
    // GitHub Pages 배포를 위한 base href 동적 설정
    (function() {
      var baseHref = document.querySelector('base').getAttribute('href');
      if (baseHref === '$FLUTTER_BASE_HREF') {
        // GitHub Pages에서 실행 중인 경우
        var pathSegments = window.location.pathname.split('/');
        if (pathSegments.length > 2) {
          // 리포지토리 이름이 URL에 포함된 경우
          var repoName = pathSegments[1];
          document.querySelector('base').setAttribute('href', '/' + repoName + '/');
        }
      }
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
